<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 视频工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#fff;min-height:100vh}main{max-width:760px;margin:auto;padding:22px 16px 40px}.hero{padding:10px 0 18px}h1{font-size:30px;margin:0 0 8px}p{color:#aeb8d0}.card{background:#141b31;border:1px solid #26304d;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 10px 30px #0003}label{display:block;font-weight:700;margin:12px 0 8px}textarea,input,select{width:100%;border:1px solid #303b5d;background:#0e1528;color:#fff;border-radius:13px;padding:13px;font-size:16px;outline:none}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #35415f;border-radius:999px;padding:8px 12px;background:#10182c;color:#dce3f5;cursor:pointer}.chip.active{border-color:#8ea7ff;background:#26345e}.primary{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:#fff;color:#101426;font-size:17px;font-weight:800}.muted{font-size:13px;color:#8994ad;line-height:1.6}.status{margin-top:12px;padding:12px;border-radius:12px;background:#0e1528;color:#aeb8d0}.video{width:100%;border-radius:14px;background:#05070d;margin-top:14px;display:none}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#202b4a;color:#b9c8ff;font-size:12px}
</style></head>
<body><main>
<section class="hero"><span class="badge">手机优先 · 尽量 0 元</span><h1>🎬 AI 视频工作台</h1><p>先做一个免费的前端工作台。以后接入哪个视频模型，就换哪个后端，不锁死。</p></section>
<section class="card"><label for="prompt">你想生成什么视频？</label><textarea id="prompt" placeholder="例如：一只鹈鹕骑着自行车穿过东京街头，电影感，镜头跟随，夕阳光线"></textarea>
<label>视频时长</label><div class="chips" id="dur"><button class="chip active" data-v="5">5 秒</button><button class="chip" data-v="10">10 秒</button><button class="chip" data-v="15">15 秒</button></div>
<div class="row"><div><label>画幅</label><select id="ratio"><option>9:16 竖屏</option><option>16:9 横屏</option><option>1:1 方形</option></select></div><div><label>模式</label><select id="mode"><option>文字生成视频</option><option>图片生成视频</option></select></div></div>
<button class="primary" id="go">✨ 生成视频</button><div class="status" id="status">当前为演示工作台：还没有绑定付费 API，不会偷偷扣费。</div><video id="preview" class="video" controls playsinline></video></section>
<section class="card"><b>省钱策略</b><p class="muted">① 默认先用免费网页端服务验证需求；② 需要自动生成时，再接免费额度或低价 API；③ 每次生成前显示预计成本；④ 15 秒暂时作为目标，实际免费额度不足时自动建议 5/10 秒。</p></section>
</main><script>
let duration='5';document.querySelectorAll('#dur .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dur .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');duration=b.dataset.v});
document.getElementById('go').onclick=()=>{const p=document.getElementById('prompt').value.trim();const s=document.getElementById('status');if(!p){s.textContent='先写一句你想生成的视频内容吧。';return}s.innerHTML='已记录生成任务：'+duration+' 秒 · '+document.getElementById('ratio').value+'。下一步接入实际视频模型 API。';};
</script></body></html>
