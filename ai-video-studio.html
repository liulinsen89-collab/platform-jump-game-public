<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 视频工作台 · T2V FIX-12</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 40px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#202b4a;color:#b9c8ff;font-size:12px}h1{font-size:30px;margin:10px 0 8px}p{color:#aeb8d0}.card{background:#141b31;border:1px solid #26304d;border-radius:20px;padding:18px;margin-top:14px}label{display:block;font-weight:700;margin:13px 0 8px}input,textarea,select{width:100%;padding:13px;border-radius:13px;border:1px solid #303b5d;background:#0e1528;color:#fff;font-size:16px}textarea{min-height:120px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 13px;border-radius:999px;border:1px solid #35415f;background:#10182c;color:#dce3f5}.active{border-color:#8ea7ff;background:#26345e}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;margin-top:12px;padding:14px;border-radius:14px;font-size:16px;font-weight:800}.primary{border:0;background:#fff;color:#101426}.secondary{border:1px solid #35415f;background:#10182c;color:#dce3f5}.box{margin-top:12px;padding:12px;border-radius:12px;background:#0e1528;border:1px solid #303b5d;line-height:1.6}.success{color:#b8f2cb}.danger{color:#ffbdc4}.muted{font-size:13px;color:#8994ad;line-height:1.6}.log{margin:6px 0;padding:8px 10px;border-radius:8px;background:#111a30;font-size:13px;word-break:break-word}.video{width:100%;margin-top:14px;border-radius:14px}.link{display:inline-block;margin-top:12px;color:#b9c8ff}</style></head><body><main><span class="badge">T2V FIX-12 · 官方 InferenceClient · Provider 路由</span><h1>🎬 AI 视频工作台</h1><p>本版改回 Hugging Face 官方 InferenceClient 调用方式，并保留 Provider 逐路诊断。Token 只保存在本机浏览器。</p><section class="card"><label>Hugging Face Access Token</label><input id="token" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="hf_••••••••"><p class="muted">不要把 Token 发到聊天里。</p><button class="btn secondary" id="check">🔐 测试 Token</button><div class="box" id="checkResult">尚未检测</div><label>你想生成什么视频？</label><textarea id="prompt" placeholder="例如：一只小猫在东京街头奔跑，电影感，镜头跟随，夕阳光线"></textarea><label>视频时长</label><div class="chips" id="dur"><button class="chip active" data-v="5">5 秒（推荐）</button><button class="chip" data-v="10">10 秒</button><button class="chip" data-v="15">15 秒</button></div><div class="row"><div><label>画幅</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select></div><div><label>模型</label><select id="model"><option value="Wan-AI/Wan2.2-TI2V-5B">Wan 2.2 TI2V-5B</option></select></div></div><label>Provider 路由</label><select id="provider"><option value="auto">auto（官方自动路由，推荐）</option><option value="fal-ai">fal.ai</option><option value="replicate">Replicate</option><option value="wavespeed">WaveSpeedAI</option></select><p class="muted">💰 不自动充值、不自动购买。只调用你 Token 可用的 Inference Provider。</p><button class="btn primary" id="go">✨ 免费额度生成</button><div class="box" id="status">先测试 Token，再生成。</div><div class="box"><b>🔎 Provider 诊断</b><div id="diag">尚未开始</div></div><video id="video" class="video" controls playsinline style="display:none"></video><a id="download" class="link" style="display:none" download="ai-video.mp4">⬇️ 保存视频</a></section></main><script type="module">import {InferenceClient} from 'https://esm.sh/@huggingface/inference@4.13.28';const $=id=>document.getElementById(id),tokenEl=$('token'),check=$('check'),checkResult=$('checkResult'),status=$('status'),go=$('go'),prompt=$('prompt'),diag=$('diag'),video=$('video'),download=$('download');let duration='5';const clean=v=>{let s=String(v??'').normalize('NFKC').replace(/[\s\u0000-\u001F\u007F\u00A0\u200B-\u200D\u2060\uFEFF]/g,'').trim();if(s.startsWith('hf_'))return s;const m=s.match(/hf_[A-Za-z0-9_-]+/);return m?m[0]:''};const getToken=()=>{const a=clean(tokenEl.value);if(a)return a;try{return clean(localStorage.getItem('hf_token'))}catch{return ''}};try{const x=localStorage.getItem('hf_token');if(x)tokenEl.value=x}catch{};tokenEl.oninput=()=>{const t=clean(tokenEl.value);if(t)try{localStorage.setItem('hf_token',t)}catch{};status.textContent=t?'Token 已读取。':'请填写 Token。'};document.querySelectorAll('#dur .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dur .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');duration=b.dataset.v});const add=(s,c='')=>{const d=document.createElement('div');d.className='log '+c;d.textContent=s;diag.appendChild(d)};async function validate(){const t=getToken();if(!t)throw Error('找不到 Token');const r=await fetch('https://router.huggingface.co/v1/models?x='+Date.now(),{headers:{Authorization:'Bearer '+t,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error('Token 检测 HTTP '+r.status+'：'+(await r.text()).slice(0,300));try{localStorage.setItem('hf_token',t);tokenEl.value=t}catch{}return t}check.onclick=async()=>{check.disabled=true;checkResult.className='box';checkResult.textContent='⏳ 检测中……';try{await validate();checkResult.className='box success';checkResult.textContent='✅ Token 有效，Router 已接受。'}catch(e){checkResult.className='box danger';checkResult.textContent='❌ '+e.message}finally{check.disabled=false}};async function generate(provider,t,model,input){const hf=new InferenceClient(t);add(provider+'：官方 textToVideo 调用开始');const blob=await hf.textToVideo({model,inputs:input,provider});if(!(blob instanceof Blob))throw Error('Provider 返回的数据不是 Blob');return blob}go.onclick=async()=>{const p=prompt.value.trim(),model=$('model').value,provider=$('provider').value,ratio=$('ratio').value;if(!getToken()){status.className='box danger';status.textContent='❌ 找不到 Token，请先填写正确的 Token。';return}if(!p){status.className='box danger';status.textContent='❌ 请先填写视频描述。';return}go.disabled=true;check.disabled=true;diag.innerHTML='';try{const t=await validate();status.className='box';status.textContent='① Token 有效，准备调用官方 Provider 路由……';const input=`${p}. Cinematic video, ${ratio} aspect ratio, approximately ${duration} seconds.`;let blob;const list=provider==='auto'?['auto']:[''+provider];for(const pv of list){try{blob=await generate(pv,t,model,input);add(pv+'：🟢 视频返回成功','success');break}catch(e){add(pv+'：❌ '+(e?.message||e),'danger')}}if(!blob)throw Error('Provider 未返回视频，请查看上面的诊断信息。');const url=URL.createObjectURL(blob);video.src=url;video.style.display='block';download.href=url;download.style.display='inline-block';status.className='box success';status.textContent='🎉 视频生成成功！'}catch(e){status.className='box danger';status.textContent='生成失败：'+(e?.message||e)}finally{go.disabled=false;check.disabled=false}};</script></body></html>
