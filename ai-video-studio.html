<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI 视频工作台 · T2V FIX-5</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#fff;min-height:100vh}main{max-width:760px;margin:auto;padding:22px 16px 40px}.hero{padding:10px 0 18px}h1{font-size:30px;margin:0 0 8px}p{color:#aeb8d0}.card{background:#141b31;border:1px solid #26304d;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 10px 30px #0003}label{display:block;font-weight:700;margin:12px 0 8px}textarea,input,select{width:100%;border:1px solid #303b5d;background:#0e1528;color:#fff;border-radius:13px;padding:13px;font-size:16px;outline:none}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #35415f;border-radius:999px;padding:8px 12px;background:#10182c;color:#dce3f5;cursor:pointer}.chip.active{border-color:#8ea7ff;background:#26345e}.primary{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:#fff;color:#101426;font-size:17px;font-weight:800}.primary:disabled,.secondary:disabled{opacity:.55}.secondary{width:100%;margin-top:10px;padding:12px;border:1px solid #35415f;border-radius:14px;background:#10182c;color:#dce3f5;font-size:15px;font-weight:700}.muted{font-size:13px;color:#8994ad;line-height:1.6}.status,.check-result{margin-top:12px;padding:12px;border-radius:12px;background:#0e1528;color:#aeb8d0;line-height:1.55}.check-result{border:1px solid #303b5d;min-height:48px}.diag{margin-top:12px;padding:12px;border-radius:12px;background:#0a1020;border:1px solid #26304d;font-size:13px;line-height:1.6}.diag div{padding:8px 0;border-bottom:1px solid #202944}.diag div:last-child{border-bottom:0}.video{width:100%;border-radius:14px;background:#05070d;margin-top:14px;display:none}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#202b4a;color:#b9c8ff;font-size:12px}.danger{color:#ffbdc4}.success{color:#b8f2cb}.link{color:#b9c8ff}.estimate{margin-top:10px;padding:10px 12px;border-radius:12px;background:#10182c;color:#c8d2ea;font-size:13px;line-height:1.5}</style></head><body><main><section class="hero"><span class="badge">T2V FIX-5 · 官方 Wan2.2 调用 · fal.ai 专用 · 零元优先</span><h1>🎬 AI 视频工作台</h1><p>这版严格对齐 Hugging Face 当前官方 Wan 2.2 Text-to-Video 示例：使用官方 InferenceClient，固定走 fal.ai，不再混用其他 Provider。</p></section><section class="card"><label for="token">Hugging Face Access Token</label><input id="token" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="粘贴 hf_••••••••（只保存在本机浏览器）"><p class="muted">普通文本输入，可直接粘贴。⚠️ 不要把 Token 发到聊天里。</p><button class="secondary" id="check">🔐 测试 Token 是否有效</button><div class="check-result" id="checkResult">检测结果会显示在这里。</div><label for="prompt">你想生成什么视频？</label><textarea id="prompt" placeholder="例如：一只鹈鹕骑着自行车穿过东京街头，电影感，镜头跟随，夕阳光线"></textarea><label>视频时长</label><div class="chips" id="dur"><button class="chip active" data-v="5">5 秒（推荐）</button><button class="chip" data-v="10">10 秒</button><button class="chip" data-v="15">15 秒</button></div><div class="row"><div><label>画幅</label><select id="ratio"><option value="9:16">9:16 竖屏</option><option value="16:9">16:9 横屏</option><option value="1:1">1:1 方形</option></select></div><div><label>模型</label><select id="model"><option value="Wan-AI/Wan2.2-TI2V-5B">Wan 2.2 TI2V-5B（文生视频，推荐）</option></div></div><div class="estimate" id="estimate">💰 当前路线：Hugging Face → fal.ai → Wan2.2。不会自动购买额度。首次测试推荐 5 秒。</div><button class="primary" id="go">✨ 免费额度生成</button><div class="status" id="status">准备好了。先点「测试 Token 是否有效」。</div><div class="diag" id="diag"><b>🔎 Provider 诊断</b><div>fal.ai：尚未测试</div><div>调用方式：官方 textToVideo</div><div>模型：Wan-AI/Wan2.2-TI2V-5B</div></div><video id="preview" class="video" controls playsinline></video><a id="download" class="link" style="display:none" download="ai-video.mp4">⬇️ 保存视频</a></section><section class="card"><b>🛡️ 零元安全规则</b><p class="muted">本网页不保存付款信息、不购买额度，也没有自动充值逻辑。若免费额度不足或 Provider 要求付费，会直接停止。</p></section></main><script>const tokenEl=document.getElementById('token'),promptEl=document.getElementById('prompt'),statusEl=document.getElementById('status'),go=document.getElementById('go'),check=document.getElementById('check'),checkResult=document.getElementById('checkResult'),video=document.getElementById('preview'),download=document.getElementById('download'),estimateEl=document.getElementById('estimate'),diagEl=document.getElementById('diag');let duration='5';try{const saved=localStorage.getItem('hf_token');if(saved)tokenEl.value=saved}catch(e){}function cleanToken(){let raw=String(tokenEl.value||'').normalize('NFKC').replace(/[\u0000-\u001F\u007F\u00A0\u200B-\u200D\u2060\uFEFF\s]/g,'').replace(/^['\"]|['\"]$/g,'');const m=raw.match(/hf_[A-Za-z0-9_-]+/);return m?m[0]:raw.replace(/[^\x00-\x7F]/g,'')}function setStatus(t,c=''){statusEl.className='status '+c;statusEl.textContent=t}function setCheck(t,c=''){checkResult.className='check-result '+c;checkResult.textContent=t}function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function resetDiag(){diagEl.innerHTML='<b>🔎 Provider 诊断</b><div>fal.ai：⏳ 等待测试</div><div>调用方式：官方 textToVideo</div><div>模型：Wan-AI/Wan2.2-TI2V-5B</div>'}function diagUpdate(name,text,cls=''){const rows=[...diagEl.querySelectorAll('div')];if(name==='fal.ai'&&rows[0]){rows[0].className=cls;rows[0].innerHTML='fal.ai：'+esc(text)}}function shortError(e){const m=e?.message||String(e);return m.length>700?m.slice(0,700)+'…':m}tokenEl.addEventListener('input',()=>{try{localStorage.setItem('hf_token',cleanToken())}catch(e){}});document.querySelectorAll('#dur .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dur .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');duration=b.dataset.v;estimateEl.textContent=`💰 当前路线：Hugging Face → fal.ai → Wan2.2 · ${duration} 秒 · 不自动购买额度`});async function validateToken(show=true){const token=cleanToken();if(!token){if(show){setCheck('❌ 没有检测到 Token。','danger');setStatus('❌ 没有检测到 Token。','danger')}return false}if(!token.startsWith('hf_')){if(show){setCheck('❌ Token 不是 hf_ 开头。请确认复制的是 Token Value。','danger');setStatus('❌ Token 格式不对，没有发起网络请求。','danger')}return false}const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);try{if(show){setCheck('⏳ 正在连接 Hugging Face Inference Router……');setStatus('⏳ 正在检测 Token，最多等待 12 秒……')}const r=await fetch('https://router.huggingface.co/v1/models?x='+Date.now(),{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store',signal:c.signal});const text=await r.text();let d={};try{d=JSON.parse(text)}catch(e){}if(!r.ok)throw Error((d?.error||d?.message||('HTTP '+r.status))+'（Inference Router）');localStorage.setItem('hf_token',token);if(show){setCheck('✅ Token 有效！Hugging Face Inference Router 已接受此 Token。','success');setStatus('✅ Token 验证通过，可以开始生成。','success')}return true}catch(e){const msg=e?.name==='AbortError'?'请求超过 12 秒，没有收到响应。':(e?.message||String(e));if(show){setCheck('❌ Token 检测失败：'+msg,'danger');setStatus('❌ Token 检测失败。','danger')}return false}finally{clearTimeout(timer)}}check.onclick=async()=>{const t=check.textContent;check.disabled=true;check.textContent='⏳ 正在检测…';await validateToken(true);check.disabled=false;check.textContent=t};async function loadInference(){return await import('https://esm.sh/@huggingface/inference@latest')}async function runVideo(hf,model,prompt,provider){return await hf.textToVideo({model,inputs:prompt,provider})}go.onclick=async()=>{const token=cleanToken(),prompt=promptEl.value.trim(),model=document.getElementById('model').value,ratio=document.getElementById('ratio').value;if(!token){setStatus('❌ 先填 Hugging Face Access Token。','danger');return}if(!prompt){setStatus('❌ 先写一句视频内容。','danger');return}go.disabled=true;check.disabled=true;video.style.display='none';download.style.display='none';resetDiag();if(!(await validateToken(false))){setStatus('❌ Token 基础验证没有通过，请先测试 Token。','danger');go.disabled=false;check.disabled=false;return}setStatus('② Token 有效。正在加载 Hugging Face 官方视频生成 SDK……');try{const {InferenceClient}=await loadInference();const hf=new InferenceClient(token);const finalPrompt=`${prompt}. Cinematic video, ${ratio} aspect ratio, approximately ${duration} seconds.`;diagUpdate('fal.ai','⏳ 正在请求……');setStatus(`③ 正在调用官方 fal.ai · ${model} ……`);let blob;try{blob=await runVideo(hf,model,finalPrompt,'fal-ai');diagUpdate('fal.ai','🟢 成功','success')}catch(e){diagUpdate('fal.ai',shortError(e),'danger');throw e}const url=URL.createObjectURL(blob);video.src=url;video.style.display='block';download.href=url;download.style.display='inline-block';download.style.marginTop='12px';setStatus('🎉 视频生成成功！可以直接播放或保存。','success')}catch(e){console.error(e);let msg=e?.message||String(e),low=msg.toLowerCase();if(low.includes('402')||low.includes('credit')||low.includes('payment'))msg+='\n\n⚠️ 看起来是额度/付费问题；页面不会自动购买。';else if(low.includes('401')||low.includes('unauthorized')||low.includes('invalid username')||low.includes('authentication'))msg+='\n\n⚠️ 看起来是 Provider 鉴权/权限问题；Token 基础验证本身已经通过。';setStatus('生成失败：'+msg,'danger')}finally{go.disabled=false;check.disabled=false}};</script></body></html>
