<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI 视频工作台 · T2V FIX-11</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#fff}main{max-width:760px;margin:auto;padding:22px 16px 40px}.hero{padding:10px 0 18px}h1{font-size:30px;margin:0 0 8px}p{color:#aeb8d0}.card{background:#141b31;border:1px solid #26304d;border-radius:20px;padding:18px;margin-top:14px}label{display:block;font-weight:700;margin:12px 0 8px}textarea,input,select{width:100%;border:1px solid #303b5d;background:#0e1528;color:#fff;border-radius:13px;padding:13px;font-size:16px}textarea{min-height:120px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #35415f;border-radius:999px;padding:8px 12px;background:#10182c;color:#dce3f5}.chip.active{border-color:#8ea7ff;background:#26345e}.primary,.secondary{width:100%;margin-top:12px;padding:14px;border-radius:14px;font-size:16px;font-weight:800}.primary{border:0;background:#fff;color:#101426}.secondary{border:1px solid #35415f;background:#10182c;color:#dce3f5}.status,.result,.diag{margin-top:12px;padding:12px;border-radius:12px;background:#0e1528;line-height:1.6}.result,.diag{border:1px solid #303b5d}.success{color:#b8f2cb}.danger{color:#ffbdc4}.muted{font-size:13px;color:#8994ad;line-height:1.6}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#202b4a;color:#b9c8ff;font-size:12px}.video{width:100%;margin-top:14px;border-radius:14px}.link{display:inline-block;margin-top:12px;color:#b9c8ff}.log{margin:6px 0;padding:7px 9px;border-radius:8px;background:#111a30;font-size:13px;word-break:break-word}.ok{color:#b8f2cb}.err{color:#ffbdc4}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main><section class="hero"><span class="badge">T2V FIX-11 · Wan2.2 · 直连 HF→fal 路由</span><h1>🎬 AI 视频工作台</h1><p>本版绕过浏览器 SDK 的 Provider 解析，直接调用 Hugging Face Router 的官方 fal.ai 队列路由；Token 仍只保存在本机。</p></section><section class="card"><label>Hugging Face Access Token</label><input id="token" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="hf_••••••••"><p class="muted">Token 只保存在本机浏览器，不要发送到聊天。</p><button class="secondary" id="check">🔐 测试 Token 是否有效</button><div class="result" id="checkResult">检测结果会显示在这里。</div><label>你想生成什么视频？</label><textarea id="prompt" placeholder="例如：一只小猫在东京街头奔跑，电影感，镜头跟随，夕阳光线"></textarea><label>视频时长</label><div class="chips" id="dur"><button class="chip active" data-v="5">5 秒（推荐）</button><button class="chip" data-v="10">10 秒</button><button class="chip" data-v="15">15 秒</button></div><div class="row"><div><label>画幅</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select></div><div><label>模型</label><select id="model"><option value="Wan-AI/Wan2.2-TI2V-5B">Wan 2.2 TI2V-5B</option></select></div></div><p class="muted">💰 不自动充值、不自动购买。Provider 免费额度不足时直接停止。</p><button class="primary" id="go">✨ 免费额度生成</button><div class="status" id="status">先测试 Token，再生成。</div><div class="diag" id="diag"><b>🔎 Provider 诊断</b><div id="diagText">尚未开始</div></div><video id="video" class="video" controls playsinline style="display:none"></video><a id="download" class="link" style="display:none" download="ai-video.mp4">⬇️ 保存视频</a></section></main><script>(()=>{const $=id=>document.getElementById(id),tokenEl=$('token'),check=$('check'),checkResult=$('checkResult'),status=$('status'),go=$('go'),prompt=$('prompt'),diag=$('diagText'),video=$('video'),download=$('download');let duration='5';const MODEL='Wan-AI/Wan2.2-TI2V-5B',ROUTE='https://router.huggingface.co/fal-ai/fal-ai/wan/v2.2-5b/text-to-video?_subdomain=queue';function setStatus(t,c=''){status.className='status '+c;status.textContent=t}function setCheck(t,c=''){checkResult.className='result '+c;checkResult.textContent=t}function log(t,c=''){const d=document.createElement('div');d.className='log '+c;d.textContent=t;diag.appendChild(d)}function clean(v){let s=String(v??'').normalize('NFKC').replace(/[\s\u0000-\u001F\u007F\u00A0\u200B-\u200D\u2060\uFEFF]/g,'').trim();if(s.startsWith('hf_'))return s;const m=s.match(/hf_[A-Za-z0-9_-]+/);return m?m[0]:''}function token(){const a=clean(tokenEl.value);if(a)return a;try{return clean(localStorage.getItem('hf_token'))}catch(e){return ''}}try{const x=localStorage.getItem('hf_token');if(x)tokenEl.value=x}catch(e){}tokenEl.oninput=()=>{const t=clean(tokenEl.value);if(t)try{localStorage.setItem('hf_token',t)}catch(e){}setStatus(t?'Token 已读取。':'请填写 Token。')};document.querySelectorAll('#dur .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dur .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');duration=b.dataset.v});async function valid(){const t=token();if(!t)throw Error('找不到 Token');const r=await fetch('https://router.huggingface.co/v1/models?x='+Date.now(),{headers:{Authorization:'Bearer '+t,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);try{localStorage.setItem('hf_token',t);tokenEl.value=t}catch(e){}}check.onclick=async()=>{check.disabled=true;setCheck('⏳ 正在检测……');try{await valid();setCheck('✅ Token 有效！Hugging Face Inference Router 已接受此 Token。','success');setStatus('Token 验证通过，可以生成。','success')}catch(e){setCheck('❌ Token 检测失败：'+e.message,'danger')}finally{check.disabled=false}};async function falGenerate(t,input){const r=await fetch(ROUTE,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({prompt:input})});const txt=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' · '+txt.slice(0,500));let j;try{j=JSON.parse(txt)}catch(e){throw Error('Provider 返回非 JSON：'+txt.slice(0,300))}if(j.video?.url)return fetch(j.video.url).then(x=>x.blob());const responseUrl=j.response_url;if(!responseUrl)throw Error('Provider 未返回 response_url：'+txt.slice(0,500));const u=new URL(responseUrl);const path=u.pathname;const base='https://router.huggingface.co/fal-ai';const statusUrl=base+path+'/status?_subdomain=queue';const resultUrl=base+path+'?_subdomain=queue';for(let i=0;i<180;i++){await new Promise(r=>setTimeout(r,2000));const sr=await fetch(statusUrl,{headers:{Authorization:'Bearer '+t,Accept:'application/json'}});const st=await sr.json();log('fal.ai：状态 '+(st.status||'UNKNOWN'));if(st.status==='COMPLETED')break;if(st.status==='FAILED')throw Error(JSON.stringify(st).slice(0,700));if(i===179)throw Error('生成超时');}const rr=await fetch(resultUrl,{headers:{Authorization:'Bearer '+t,Accept:'application/json'}});const rt=await rr.text();if(!rr.ok)throw Error('结果 HTTP '+rr.status+' · '+rt.slice(0,500));const out=JSON.parse(rt);const url=out.video?.url||out.video_url||out.url;if(!url)throw Error('生成完成但未找到视频地址：'+rt.slice(0,700));const vr=await fetch(url);if(!vr.ok)throw Error('视频下载失败 HTTP '+vr.status);return vr.blob()}go.onclick=async()=>{const t=token(),p=prompt.value.trim(),ratio=$('ratio').value;if(!t||!p){setStatus(!t?'❌ 找不到 Token，请先填写正确的 Token。':'❌ 请先填写视频描述。','danger');return}go.disabled=true;check.disabled=true;diag.innerHTML='';try{await valid();setStatus('① Token 有效，直接调用 Hugging Face → fal.ai……');log('fal-ai：Wan2.2-TI2V-5B 队列请求开始');const input=`${p}. Cinematic video, ${ratio} aspect ratio, approximately ${duration} seconds.`;const blob=await falGenerate(t,input);const url=URL.createObjectURL(blob);video.src=url;video.style.display='block';download.href=url;download.style.display='inline-block';log('fal-ai：🟢 视频返回成功','ok');setStatus('🎉 视频生成成功！','success')}catch(e){log('fal-ai：❌ '+(e.message||e),'err');setStatus('生成失败：'+(e.message||e),'danger')}finally{go.disabled=false;check.disabled=false}}})()</script></body></html>
