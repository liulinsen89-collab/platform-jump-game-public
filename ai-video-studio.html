<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 视频工作台 · T2V FIX-15</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 40px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#202b4a;color:#b9c8ff;font-size:12px}h1{font-size:30px;margin:10px 0 8px}p{color:#aeb8d0}.card{background:#141b31;border:1px solid #26304d;border-radius:20px;padding:18px;margin-top:14px}label{display:block;font-weight:700;margin:13px 0 8px}input,textarea,select{width:100%;padding:13px;border-radius:13px;border:1px solid #303b5d;background:#0e1528;color:#fff;font-size:16px}textarea{min-height:120px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 13px;border-radius:999px;border:1px solid #35415f;background:#10182c;color:#dce3f5}.active{border-color:#8ea7ff;background:#26345e}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;margin-top:12px;padding:14px;border-radius:14px;font-size:16px;font-weight:800}.primary{border:0;background:#fff;color:#101426}.box{margin-top:12px;padding:12px;border-radius:12px;background:#0e1528;border:1px solid #303b5d;line-height:1.6}.success{color:#b8f2cb}.danger{color:#ffbdc4}.muted{font-size:13px;color:#8994ad;line-height:1.6}.log{margin:6px 0;padding:8px 10px;border-radius:8px;background:#111a30;font-size:13px;word-break:break-word}.video{width:100%;margin-top:14px;border-radius:14px}.link{display:inline-block;margin-top:12px;color:#b9c8ff}</style></head><body><main><span class="badge">T2V FIX-15 · ZeroGPU 文件回传修复</span><h1>🎬 AI 视频工作台</h1><p>上一版已经成功生成视频，失败点只在“生成结果 → 视频文件地址”的解析。现在兼容 Gradio FileData 的 url/path、嵌套对象和新旧回传格式。</p><section class="card"><label>生成路线</label><select id="route"><option value="ltx">🆓 免费 ZeroGPU · LTX Video Fast（推荐）</option><option value="wan">Wan 2.2 · Hugging Face Provider（实验）</option></select><div id="wanAuth" style="display:none"><label>Hugging Face Access Token</label><input id="token" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="hf_••••••••"><p class="muted">Token 只保存在本机浏览器，不要发送到聊天。</p></div><label>你想生成什么视频？</label><textarea id="prompt" placeholder="例如：一只小猫在东京街头奔跑，电影感，镜头跟随，夕阳光线"></textarea><label>视频时长</label><div class="chips" id="dur"><button class="chip active" data-v="5">5 秒（推荐）</button><button class="chip" data-v="8">8 秒</button><button class="chip" data-v="8.5">8.5 秒（当前 ZeroGPU 上限）</button></div><div class="row"><div><label>画幅</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select></div><div><label>模型</label><select id="model"><option value="ltx">LTX Video Fast</option><option value="wan">Wan 2.2 TI2V-5B</option></select></div></div><p class="muted">🆓 当前免费路线使用 Lightricks 官方 LTX Video ZeroGPU Space；该 Space 当前视频时长支持约 0.3–8.5 秒。cite_placeholder</p><button class="btn primary" id="go">✨ 免费额度生成</button><div class="box" id="status">先输入视频描述，然后点击生成。</div><div class="box"><b>🔎 生成诊断</b><div id="diag">尚未开始</div></div><video id="video" class="video" controls playsinline style="display:none"></video><a id="download" class="link" style="display:none" download="ai-video.mp4">⬇️ 保存视频</a></section></main><script type="module">import{Client}from'https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js';import{InferenceClient}from'https://esm.sh/@huggingface/inference@4.13.28';const $=id=>document.getElementById(id),route=$('route'),wanAuth=$('wanAuth'),tokenEl=$('token'),prompt=$('prompt'),model=$('model'),status=$('status'),diag=$('diag'),go=$('go'),video=$('video'),download=$('download');let duration='5';const clean=v=>String(v??'').normalize('NFKC').replace(/[\s\u0000-\u001F\u007F\u00A0\u200B-\u200D\u2060\uFEFF]/g,'').trim(),add=(s,c='')=>{const d=document.createElement('div');d.className='log '+c;d.textContent=s;diag.appendChild(d)};try{const t=localStorage.getItem('hf_token');if(t)tokenEl.value=t}catch{}route.onchange=()=>{const w=route.value==='wan';wanAuth.style.display=w?'block':'none';model.value=w?'wan':'ltx'};model.onchange=()=>{const w=model.value==='wan';route.value=w?'wan':'ltx';wanAuth.style.display=w?'block':'none'};tokenEl.oninput=()=>{const t=clean(tokenEl.value);if(t)try{localStorage.setItem('hf_token',t)}catch{}};document.querySelectorAll('#dur .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dur .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');duration=b.dataset.v});function dims(r){return r==='9:16'?[704,384]:r==='1:1'?[640,640]:[384,704]}function frames(sec){return Math.max(9,Math.min(257,Math.round((Number(sec)*30-1)/8)*8+1))}function findFile(x,seen=new Set()){if(x==null)return null;if(typeof x==='string'){if(/^https?:\/\//.test(x)||x.startsWith('/'))return x;return null}if(typeof x!=='object'||seen.has(x))return null;seen.add(x);if(typeof x.url==='string'&&x.url)return x.url;if(typeof x.path==='string'&&x.path)return x.path;for(const v of Object.values(x)){const f=findFile(v,seen);if(f)return f}return null}async function blobFromResult(out){const raw=findFile(out);if(!raw){add('返回结构：'+JSON.stringify(out).slice(0,900),'danger');throw Error('没有找到视频文件地址')}let u=raw;if(u.startsWith('http')){add('找到视频 URL：'+u.slice(0,180));}else{u='https://lightricks-ltx-video-distilled.hf.space/file='+raw;add('找到 Gradio 文件路径，转换为可访问 URL')}const r=await fetch(u);if(!r.ok)throw Error('视频下载 HTTP '+r.status);const b=await r.blob();if(!b.size)throw Error('视频文件为空');return b}async function ltxGenerate(p,r,sec){const[height,width]=dims(r),n=frames(sec);if(Number(sec)>8.5){add('ZeroGPU 当前上限 8.5 秒，已自动限制','danger')}add('LTX Video Fast：连接官方 ZeroGPU Space');const app=await Client.connect('Lightricks/ltx-video-distilled',{status_callback:s=>{if(s?.status)status.textContent='⏳ ZeroGPU：'+s.status+(s.message?' · '+s.message:'')}});add('LTX：已连接，提交 Text-to-Video 队列');const job=app.submit('/text_to_video',[p,'worst quality, inconsistent motion, blurry, jittery, distorted',null,null,height,width,'text-to-video',Math.min(8.5,Number(sec)),9,Math.floor(Math.random()*2147483647),true,1,false]);let last=null;for await(const m of job){if(m.type==='status'){const s=m.status||{};if(s.stage==='pending')status.textContent='⏳ 排队中'+(s.position!=null?' · 前面还有 '+s.position+' 个请求':'');else if(s.stage==='generating')status.textContent='🎬 ZeroGPU 正在生成…';else if(s.stage==='complete')status.textContent='📦 正在接收视频文件…'}if(m.type==='data'&&m.data?.length){last=m.data;add('LTX：🟢 服务器已返回生成结果','success')}}if(!last)throw Error('ZeroGPU 没有返回最终数据');return last}async function wanGenerate(t,p,r,sec){const hf=new InferenceClient(t),input=`${p}. Cinematic video, ${r} aspect ratio, approximately ${sec} seconds.`;add('Wan2.2：官方 textToVideo 调用开始');return await hf.textToVideo({model:'Wan-AI/Wan2.2-TI2V-5B',inputs:input,provider:'auto'})}go.onclick=async()=>{const p=prompt.value.trim(),r=$('ratio').value;if(!p){status.className='box danger';status.textContent='❌ 请先填写视频描述。';return}go.disabled=true;diag.innerHTML='';try{let blob;if(model.value==='ltx'){status.className='box';status.textContent='① 正在连接免费 ZeroGPU…';const out=await ltxGenerate(p,r,duration);blob=await blobFromResult(out)}else{const t=clean(tokenEl.value)||clean(localStorage.getItem('hf_token'));if(!t)throw Error('Wan2.2 实验路线需要 Hugging Face Token');status.textContent='① 正在调用 Wan2.2 Provider…';blob=await wanGenerate(t,p,r,duration)}const url=URL.createObjectURL(blob);video.src=url;video.style.display='block';download.href=url;download.style.display='inline-block';status.className='box success';status.textContent='🎉 视频生成成功！'}catch(e){add('❌ '+(e?.message||e),'danger');status.className='box danger';status.textContent='生成失败：'+(e?.message||e)}finally{go.disabled=false}};</script></body></html>
