<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI 视频工作台 · T2V FIX-9</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#fff}main{max-width:760px;margin:auto;padding:22px 16px 40px}.hero{padding:10px 0 18px}h1{font-size:30px;margin:0 0 8px}p{color:#aeb8d0}.card{background:#141b31;border:1px solid #26304d;border-radius:20px;padding:18px;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #35415f;border-radius:999px;padding:8px 12px;background:#10182c;color:#dce3f5}.chip.active{border-color:#8ea7ff;background:#26345e}label{display:block;font-weight:700;margin:12px 0 8px}textarea,input,select{width:100%;border:1px solid #303b5d;background:#0e1528;color:#fff;border-radius:13px;padding:13px;font-size:16px}textarea{min-height:120px}.primary,.secondary{width:100%;margin-top:12px;padding:14px;border-radius:14px;font-size:16px;font-weight:800}.primary{border:0;background:#fff;color:#101426}.secondary{border:1px solid #35415f;background:#10182c;color:#dce3f5}.status,.result,.diag{margin-top:12px;padding:12px;border-radius:12px;background:#0e1528;line-height:1.6}.result,.diag{border:1px solid #303b5d}.success{color:#b8f2cb}.danger{color:#ffbdc4}.muted{font-size:13px;color:#8994ad;line-height:1.6}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#202b4a;color:#b9c8ff;font-size:12px}.video{width:100%;margin-top:14px;border-radius:14px}.link{display:inline-block;margin-top:12px;color:#b9c8ff}</style></head><body><main><section class="hero"><span class="badge">T2V FIX-9 · Wan2.2 · Token 稳定识别</span><h1>🎬 AI 视频工作台</h1><p>修复 FIX-8 的 Token 识别问题：不再用过严的正则截断 Token，直接清理空白和不可见字符后使用完整 Token。保留 WaveSpeedAI → fal.ai → auto Provider 容错。</p></section><section class="card"><label>Hugging Face Access Token</label><input id="token" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="hf_••••••••"><p class="muted">Token 只保存在本机浏览器，不要发送到聊天。</p><button class="secondary" id="check">🔐 测试 Token 是否有效</button><div class="result" id="checkResult">检测结果会显示在这里。</div><label>你想生成什么视频？</label><textarea id="prompt" placeholder="例如：一只小猫在东京街头奔跑，电影感，镜头跟随，夕阳光线"></textarea><label>视频时长</label><div class="chips" id="dur"><button class="chip active" data-v="5">5 秒（推荐）</button><button class="chip" data-v="10">10 秒</button><button class="chip" data-v="15">15 秒</button></div><div class="row"><div><label>画幅</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select></div><div><label>模型</label><select id="model"><option value="Wan-AI/Wan2.2-TI2V-5B">Wan 2.2 TI2V-5B</option></select></div></div><p class="muted">💰 不自动充值、不自动购买。Provider 免费额度不足时直接停止。</p><button class="primary" id="go">✨ 免费额度生成</button><div class="status" id="status">先测试 Token，再生成。</div><div class="diag" id="diag"><b>🔎 Provider 诊断</b><div id="diagText">尚未开始</div></div><video id="video" class="video" controls playsinline style="display:none"></video><a id="download" class="link" style="display:none" download="ai-video.mp4">⬇️ 保存视频</a></section></main><script>(()=>{const $=id=>document.getElementById(id);const tokenEl=$('token'),check=$('check'),checkResult=$('checkResult'),status=$('status'),go=$('go'),prompt=$('prompt'),diag=$('diagText'),video=$('video'),download=$('download');let duration='5';function cls(el,c){if(el)el.className=c}function setStatus(t,c=''){if(status){cls(status,'status '+c);status.textContent=t}}function setCheck(t,c=''){if(checkResult){cls(checkResult,'result '+c);checkResult.textContent=t}}function cleanValue(v){let s=String(v??'').normalize('NFKC').replace(/[\s\u0000-\u001F\u007F\u00A0\u200B-\u200D\u2060\uFEFF]/g,'').trim();if(s.startsWith('hf_'))return s;const m=s.match(/hf_[A-Za-z0-9_-]+/);return m?m[0]:''}function clean(){const direct=cleanValue(tokenEl?.value);if(direct)return direct;try{return cleanValue(localStorage.getItem('hf_token'))}catch(e){return ''}}try{const x=localStorage.getItem('hf_token');if(x)tokenEl.value=x}catch(e){}tokenEl?.addEventListener('input',()=>{const t=cleanValue(tokenEl.value);try{if(t)localStorage.setItem('hf_token',t)}catch(e){}setCheck('检测结果会显示在这里。');setStatus(t?'Token 已读取，点击“测试 Token”确认。':'请填写 Token。')});document.querySelectorAll('#dur .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dur .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');duration=b.dataset.v});async function valid(){const t=clean();if(!t)throw Error('找不到 Token，请在上方填写或恢复已保存 Token');const r=await fetch('https://router.huggingface.co/v1/models?x='+Date.now(),{headers:{Authorization:'Bearer '+t,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);try{localStorage.setItem('hf_token',t);if(tokenEl)tokenEl.value=t}catch(e){}return true}check.onclick=async()=>{check.disabled=true;setCheck('⏳ 正在检测……');try{await valid();setCheck('✅ Token 有效！Hugging Face Inference Router 已接受此 Token。','success');setStatus('Token 验证通过，可以生成。','success')}catch(e){setCheck('❌ Token 检测失败：'+(e.message||e),'danger');setStatus('Token 检测失败。','danger')}finally{check.disabled=false}};async function sdk(){return import('https://esm.sh/@huggingface/inference@latest')}async function call(hf,provider,model,input){diag.textContent=provider+'：正在调用 Wan2.2……';return hf.textToVideo({model,inputs:input,provider})}go.onclick=async()=>{const t=clean(),p=prompt?.value.trim(),model=$('model')?.value,ratio=$('ratio')?.value;if(!t){setStatus('❌ 找不到 Token，请先填写正确的 Token。','danger');return}if(!p){setStatus('❌ 请先填写视频描述。','danger');return}go.disabled=true;check.disabled=true;try{await valid();setStatus('② Token 有效，加载官方 SDK……');const {InferenceClient}=await sdk();const hf=new InferenceClient(t);const input=`${p}. Cinematic video, ${ratio} aspect ratio, approximately ${duration} seconds.`;let blob,last;for(const provider of ['wavespeed','fal-ai','auto']){try{setStatus('③ 正在尝试 '+provider+' · '+model+' ……');blob=await call(hf,provider,model,input);diag.textContent=provider+'：🟢 成功';break}catch(e){last=e;diag.textContent=provider+'：❌ '+(e.message||String(e))}}if(!blob)throw last||Error('所有 Provider 均失败');const url=URL.createObjectURL(blob);video.src=url;video.style.display='block';download.href=url;download.style.display='inline-block';setStatus('🎉 视频生成成功！','success')}catch(e){setStatus('生成失败：'+(e?.message||String(e)),'danger')}finally{go.disabled=false;check.disabled=false}}})()</script></body></html>
