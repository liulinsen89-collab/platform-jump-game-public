<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 视频工作台 · FIX-21</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 40px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#202b4a;color:#b9c8ff;font-size:12px}h1{font-size:30px;margin:10px 0 8px}p{color:#aeb8d0}.card{background:#141b31;border:1px solid #26304d;border-radius:20px;padding:18px;margin-top:14px}label{display:block;font-weight:700;margin:13px 0 8px}input,textarea,select{width:100%;padding:13px;border-radius:13px;border:1px solid #303b5d;background:#0e1528;color:#fff;font-size:16px}textarea{min-height:120px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 13px;border-radius:999px;border:1px solid #35415f;background:#10182c;color:#dce3f5}.active{border-color:#8ea7ff;background:#26345e}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;margin-top:12px;padding:14px;border-radius:14px;font-size:16px;font-weight:800}.primary{border:0;background:#fff;color:#101426}.box{margin-top:12px;padding:12px;border-radius:12px;background:#0e1528;border:1px solid #303b5d;line-height:1.6}.success{color:#b8f2cb}.danger{color:#ffbdc4}.muted{font-size:13px;color:#8994ad;line-height:1.6}.log{margin:6px 0;padding:8px 10px;border-radius:8px;background:#111a30;font-size:13px;word-break:break-word}.video{width:100%;margin-top:14px;border-radius:14px;background:#000}.link{display:inline-block;margin-top:12px;color:#b9c8ff}</style></head><body><main><span class="badge">T2V FIX-21 · ZeroGPU 账号认证修复</span><h1>🎬 AI 视频工作台</h1><p>本版继续使用免费 LTX ZeroGPU，并自动使用你已经保存在浏览器本机的 Hugging Face Token 进行账号认证。Token 不写入 GitHub。</p><section class="card"><label>生成路线</label><select id="route"><option value="ltx">🆓 免费 ZeroGPU · LTX Video 0.9.8（推荐）</option><option value="wan">Wan 2.2 · Hugging Face Provider（实验）</option></select><div id="wanAuth" style="display:none"><label>Hugging Face Access Token</label><input id="token" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="hf_••••••••"><p class="muted">Token 只保存在本机浏览器，不要发送到聊天。</p></div><label>你想生成什么视频？</label><textarea id="prompt" placeholder="例如：一只小猫在东京街头奔跑，电影感，镜头跟随，夕阳光线"></textarea><label>视频时长</label><div class="chips" id="dur"><button class="chip active" data-v="5">5 秒（推荐）</button><button class="chip" data-v="8">8 秒</button><button class="chip" data-v="8.5">8.5 秒</button></div><div class="row"><div><label>画幅</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select></div><div><label>模型</label><select id="model"><option value="ltx">LTX Video 0.9.8</option><option value="wan">Wan 2.2 TI2V-5B</option></select></div></div><div class="box"><b>🔐 Hugging Face 认证</b><div id="authState" class="muted">正在检查本机 Token…</div></div><button class="btn primary" id="go">✨ 免费额度生成</button><div class="box" id="status">先输入视频描述，然后点击生成。</div><div class="box"><b>🔎 生成诊断</b><div id="diag">尚未开始</div></div><video id="video" class="video" controls playsinline preload="metadata" style="display:none"></video><button id="play" class="btn" style="display:none">▶️ 播放视频</button><a id="download" class="link" style="display:none" download="ai-video.mp4">⬇️ 保存视频</a></section></main><script type="module">import{Client}from'https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js';import{InferenceClient}from'https://esm.sh/@huggingface/inference@4.13.28';const $=id=>document.getElementById(id),route=$("route"),wanAuth=$("wanAuth"),tokenEl=$("token"),authState=$("authState"),prompt=$("prompt"),model=$("model"),status=$("status"),diag=$("diag"),go=$("go"),video=$("video"),play=$("play"),download=$("download");let duration='5';const clean=v=>String(v??'').normalize('NFKC').replace(/[\s\u0000-\u001F\u007F\u00A0\u200B-\u200D\u2060\uFEFF]/g,'').trim(),getToken=()=>clean(tokenEl.value)||clean(localStorage.getItem('hf_token')||''),add=(s,c='')=>{const d=document.createElement('div');d.className='log '+c;d.textContent=s;diag.appendChild(d)};try{const t=clean(localStorage.getItem('hf_token')||'');if(t){tokenEl.value=t;authState.textContent='✅ 已检测到本机 HF Token；LTX ZeroGPU 将使用账号额度。'}else authState.textContent='⚠️ 未检测到 Token；LTX 将使用未认证额度，可能很快触发 ZeroGPU 限额。'}catch{authState.textContent='⚠️ 无法读取本机 Token'}route.onchange=()=>{const w=route.value==='wan';wanAuth.style.display=w?'block':'none';model.value=w?'wan':'ltx'};model.onchange=()=>{const w=model.value==='wan';route.value=w?'wan':'ltx';wanAuth.style.display=w?'block':'none'};tokenEl.oninput=()=>{const t=clean(tokenEl.value);if(t)try{localStorage.setItem('hf_token',t);authState.textContent='✅ Token 已保存在本机浏览器。'}catch{}};document.querySelectorAll('#dur .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dur .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');duration=b.dataset.v});function dims(r){return r==='9:16'?[704,384]:r==='1:1'?[640,640]:[384,704]}function findFile(x,seen=new Set()){if(x==null)return null;if(typeof x==='string'){if(/^https?:\/\//.test(x)||x.startsWith('/'))return x;return null}if(typeof x!=='object'||seen.has(x))return null;seen.add(x);if(typeof x.url==='string'&&x.url)return x.url;if(typeof x.path==='string'&&x.path)return x.path;for(const v of Object.values(x)){const f=findFile(v,seen);if(f)return f}return null}function enhancePrompt(p){const rules=[['小猫','a cute small cat'],['猫','a cat'],['东京','Tokyo, Japan'],['街头','a lively Tokyo street'],['奔跑','running fast with clear leg and body movement'],['跑','running with clear movement'],['走路','walking naturally'],['跳','jumping dynamically'],['飞','flying through the air'],['骑自行车','riding a bicycle'],['自行车','bicycle'],['汽车','car'],['女孩','a young woman'],['男孩','a young man'],['狗','a dog'],['海边','the seaside'],['夕阳','warm sunset light'],['夜景','night city lights'],['雨','falling rain'],['雪','falling snow'],['电影感','cinematic film look'],['电影级','cinematic, film-quality'],['镜头跟随','smooth tracking camera following the subject'],['镜头','cinematic camera movement'],['特写','close-up shot'],['慢动作','slow motion'],['快速','fast-paced motion'],['真实','photorealistic'],['卡通','stylized cartoon animation']];const en=[];for(const[k,v]of rules)if(p.includes(k)&&!en.includes(v))en.push(v);return p+'\n\nEnglish generation guidance: '+(en.length?en.join(', ')+'. ':'')+'The video must show obvious continuous motion and temporal change, not a still image. Keep the main subject consistent across frames. Cinematic composition, coherent action, natural movement, detailed environment.'}async function blobFromResult(out){const raw=findFile(out);if(!raw){add('返回结构：'+JSON.stringify(out).slice(0,1800),'danger');throw Error('服务器已返回结果，但没有找到视频文件地址')}let u=raw;if(u.startsWith('http'))add('找到视频 URL：'+u.slice(0,180));else{u='https://lightricks-ltx-video-distilled.hf.space/file='+raw;add('找到 Gradio 文件路径，转换为可访问 URL')}const r=await fetch(u);if(!r.ok)throw Error('视频下载 HTTP '+r.status);const b=await r.blob();if(!b.size)throw Error('视频文件为空');add('视频文件大小：'+Math.round(b.size/1024)+' KB','success');return b}async function ltxGenerate(p,r,sec){const[height,width]=dims(r),s=Math.floor(Math.random()*4294967295),guidance=1,improve=false,t=getToken();add('LTX Video 0.9.8：连接官方 ZeroGPU Space');if(t){add('🔐 检测到 HF Token：使用 Client.connect({token}) 认证账号额度','success')}else add('⚠️ 未检测到 HF Token：使用未认证 ZeroGPU 额度','danger');const options=t?{token:t}:undefined;const app=await Client.connect('Lightricks/ltx-video-distilled',options);add('LTX：已连接，使用官方 /text_to_video predict()');const enhanced=enhancePrompt(p);add('提示词增强：'+enhanced.slice(0,300));const args=[enhanced,'worst quality, inconsistent motion, blurry, jittery, distorted',null,null,height,width,'text-to-video',Math.min(8.5,Number(sec)),9,s,true,guidance,improve];add('参数：'+JSON.stringify({height,width,duration:Number(sec),frames_to_use:9,seed:s,randomize_seed:true,guidance_scale:guidance,improve_texture:improve}));status.textContent='🎬 ZeroGPU 正在生成，完成后直接接收视频…';const result=await app.predict('/text_to_video',args);add('LTX：🟢 predict() 已返回最终结果','success');add('返回结构：'+JSON.stringify(result).slice(0,1800));if(!result)throw Error('ZeroGPU 返回为空');return result.data??result}async function wanGenerate(t,p,r,sec){const hf=new InferenceClient(t),input=`${p}. Cinematic video, ${r} aspect ratio, approximately ${sec} seconds.`;add('Wan2.2：官方 textToVideo 调用开始');return await hf.textToVideo({model:'Wan-AI/Wan2.2-TI2V-5B',inputs:input,provider:'auto'})}async function startPlayback(){try{video.currentTime=0;await video.play();add('视频：▶️ 已开始播放','success')}catch(e){add('视频自动播放被浏览器拦截，请点“播放视频”按钮','danger')}}play.onclick=startPlayback;video.onloadedmetadata=()=>{add('视频元数据：'+video.videoWidth+'×'+video.videoHeight+'，时长 '+(isFinite(video.duration)?video.duration.toFixed(2):'?')+' 秒','success');play.style.display='block'};go.onclick=async()=>{const p=prompt.value.trim(),r=$("ratio").value;if(!p){status.className='box danger';status.textContent='❌ 请先填写视频描述。';return}go.disabled=true;video.pause();video.removeAttribute('src');video.load();video.style.display='none';play.style.display='none';download.style.display='none';diag.innerHTML='';try{let blob;if(model.value==='ltx'){status.className='box';status.textContent='① 正在连接免费 ZeroGPU…';const out=await ltxGenerate(p,r,duration);blob=await blobFromResult(out)}else{const t=getToken();if(!t)throw Error('Wan2.2 实验路线需要 Hugging Face Token');status.textContent='① 正在调用 Wan2.2 Provider…';blob=await wanGenerate(t,p,r,duration)}const url=URL.createObjectURL(blob);video.src=url;video.style.display='block';video.load();download.href=url;download.style.display='inline-block';status.className='box success';status.textContent='🎉 视频生成成功！正在准备播放…';setTimeout(startPlayback,500)}catch(e){add('❌ '+(e?.message||e),'danger');status.className='box danger';status.textContent='生成失败：'+(e?.message||e)}finally{go.disabled=false}};</script></body></html>
