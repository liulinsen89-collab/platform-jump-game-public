<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI 视频工作台</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#fff;min-height:100vh}main{max-width:760px;margin:auto;padding:22px 16px 40px}.hero{padding:10px 0 18px}h1{font-size:30px;margin:0 0 8px}p{color:#aeb8d0}.card{background:#141b31;border:1px solid #26304d;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 10px 30px #0003}label{display:block;font-weight:700;margin:12px 0 8px}textarea,input,select{width:100%;border:1px solid #303b5d;background:#0e1528;color:#fff;border-radius:13px;padding:13px;font-size:16px;outline:none}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #35415f;border-radius:999px;padding:8px 12px;background:#10182c;color:#dce3f5;cursor:pointer}.chip.active{border-color:#8ea7ff;background:#26345e}.primary{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:#fff;color:#101426;font-size:17px;font-weight:800}.primary:disabled{opacity:.55}.secondary{width:100%;margin-top:10px;padding:12px;border:1px solid #35415f;border-radius:14px;background:#10182c;color:#dce3f5;font-size:15px;font-weight:700}.secondary:disabled{opacity:.6}.muted{font-size:13px;color:#8994ad;line-height:1.6}.status{margin-top:12px;padding:12px;border-radius:12px;background:#0e1528;color:#aeb8d0;line-height:1.55}.check-result{margin-top:10px;padding:14px;border-radius:12px;background:#0e1528;border:1px solid #303b5d;line-height:1.55;min-height:48px}.video{width:100%;border-radius:14px;background:#05070d;margin-top:14px;display:none}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#202b4a;color:#b9c8ff;font-size:12px}.danger{color:#ffbdc4}.success{color:#b8f2cb}.link{color:#b9c8ff}.estimate{margin-top:10px;padding:10px 12px;border-radius:12px;background:#10182c;color:#c8d2ea;font-size:13px;line-height:1.5}</style></head><body><main><section class="hero"><span class="badge">手机优先 · 零元优先 · 不自动购买</span><h1>🎬 AI 视频工作台</h1><p>自动选择 Hugging Face 可用的视频 Provider。Token 只保存在你手机浏览器，不写入 GitHub。</p></section><section class="card"><label for="token">Hugging Face Access Token</label><input id="token" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="粘贴 hf_••••••••（只保存在本机浏览器）"><p class="muted">普通文本输入，可直接粘贴。⚠️ 不要把 Token 发到聊天里。</p><button class="secondary" id="check">🔐 测试 Token 是否有效</button><div class="check-result" id="checkResult">检测结果会显示在这里。</div><label for="prompt">你想生成什么视频？</label><textarea id="prompt" placeholder="例如：一只鹈鹕骑着自行车穿过东京街头，电影感，镜头跟随，夕阳光线"></textarea><label>视频时长</label><div class="chips" id="dur"><button class="chip active" data-v="5">5 秒（推荐）</button><button class="chip" data-v="10">10 秒</button><button class="chip" data-v="15">15 秒</button></div><div class="row"><div><label>画幅</label><select id="ratio"><option value="9:16">9:16 竖屏</option><option value="16:9">16:9 横屏</option><option value="1:1">1:1 方形</option></select></div><div><label>模型</label><select id="model"><option value="Lightricks/LTX-Video-0.9.8-13B-distilled">LTX-Video 0.9.8（自动路由，推荐）</option><option value="tencent/HunyuanVideo">HunyuanVideo（自动路由）</option><option value="Wan-AI/Wan2.2-TI2V-5B">Wan 2.2（自动路由）</option></select></div></div><div class="estimate" id="estimate">💰 当前模式：Hugging Face 自动寻找可用 Provider。不会自动购买额度。首次测试推荐 5 秒。</div><button class="primary" id="go">✨ 免费额度生成</button><div class="status" id="status">准备好了。先点「测试 Token 是否有效」。</div><video id="preview" class="video" controls playsinline></video><a id="download" class="link" style="display:none" download="ai-video.mp4">⬇️ 保存视频</a></section><section class="card"><b>🛡️ 零元安全规则</b><p class="muted">本网页不保存付款信息、不购买额度，也没有自动充值逻辑。若免费额度不足或提供商要求付费，会直接停止。</p></section></main><script>
const tokenEl=document.getElementById('token'),promptEl=document.getElementById('prompt'),statusEl=document.getElementById('status'),go=document.getElementById('go'),check=document.getElementById('check'),checkResult=document.getElementById('checkResult'),video=document.getElementById('preview'),download=document.getElementById('download'),estimateEl=document.getElementById('estimate');let duration='5';try{const saved=localStorage.getItem('hf_token');if(saved)tokenEl.value=saved}catch(e){}
function cleanToken(){let raw=String(tokenEl.value||'').normalize('NFKC');raw=raw.replace(/[\u0000-\u001F\u007F\u00A0\u200B-\u200D\u2060\uFEFF\s]/g,'');raw=raw.replace(/^['\"]|['\"]$/g,'');const m=raw.match(/hf_[A-Za-z0-9_-]+/);return m?m[0]:raw.replace(/[^\x00-\x7F]/g,'')}
function setStatus(t,cls=''){statusEl.className='status '+cls;statusEl.textContent=t}function setCheck(t,cls=''){checkResult.className='check-result '+cls;checkResult.textContent=t}tokenEl.addEventListener('input',()=>{try{localStorage.setItem('hf_token',cleanToken())}catch(e){}});document.querySelectorAll('#dur .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dur .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');duration=b.dataset.v;estimateEl.textContent=`💰 当前模式：Hugging Face 自动寻找可用 Provider。已选择 ${duration} 秒；不会自动购买额度。`});
async function validateToken(show=true){const token=cleanToken();if(!token){if(show){setCheck('❌ 没有检测到 Token，请粘贴完整的 hf_ Token。','danger');setStatus('❌ 没有检测到 Token。','danger')}return false}if(!token.startsWith('hf_')){if(show){setCheck('❌ 没有识别到 hf_ 开头的 Hugging Face Token。请确认复制的是 Token Value。','danger');setStatus('❌ Token 格式不对，没有发起网络请求。','danger')}return false}const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{if(show){setCheck('⏳ 正在检测：正在连接 Hugging Face Inference Router……');setStatus('⏳ 正在检测 Token，最多等待 12 秒……')}const r=await fetch('https://router.huggingface.co/v1/models?x='+Date.now(),{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store',signal:controller.signal});const text=await r.text();let data={};try{data=JSON.parse(text)}catch(e){}if(!r.ok)throw new Error((data?.error||data?.message||('HTTP '+r.status))+'（Inference Router）');try{localStorage.setItem('hf_token',token)}catch(e){}if(show){setCheck('✅ Token 有效！Hugging Face Inference Router 已接受此 Token。','success');setStatus('✅ Token 验证通过，现在可以尝试生成视频。','success')}return true}catch(err){const raw=err?.name==='AbortError'?'请求超过 12 秒，没有收到 Hugging Face Inference Router 响应。':(err?.message||String(err));if(show){setCheck('❌ Token 检测失败：'+raw,'danger');setStatus('❌ Token 检测失败，请看上面的检测结果。','danger')}return false}finally{clearTimeout(timer)}}
check.onclick=async()=>{const old=check.textContent;check.disabled=true;check.textContent='⏳ 正在检测…';await validateToken(true);check.disabled=false;check.textContent=old};async function loadInference(){return await import('https://esm.sh/@huggingface/inference')}
async function runVideo(hf,model,finalPrompt,frames){return await hf.textToVideo({model,inputs:finalPrompt,provider:'auto',parameters:{num_frames:frames}})}
go.onclick=async()=>{const token=cleanToken(),prompt=promptEl.value.trim(),model=document.getElementById('model').value,ratio=document.getElementById('ratio').value;if(!token){setStatus('❌ 先填 Hugging Face Access Token。','danger');return}if(!prompt){setStatus('❌ 先写一句你想生成的视频内容。','danger');return}go.disabled=true;check.disabled=true;video.style.display='none';download.style.display='none';if(!(await validateToken(false))){setStatus('❌ Token 基础验证没有通过，请先测试 Token。','danger');go.disabled=false;check.disabled=false;return}setStatus('② Token 有效。正在加载视频生成模块……');try{const mod=await loadInference(),InferenceClient=mod.InferenceClient,hf=new InferenceClient(token),frames=Math.min(360,Math.max(120,Number(duration)*24)),finalPrompt=`${prompt}. Cinematic video, ${ratio} aspect ratio, approximately ${duration} seconds.`;setStatus('③ 正在通过 Hugging Face 自动选择可用视频 Provider……');let blob;try{blob=await runVideo(hf,model,finalPrompt,frames)}catch(firstErr){if(model!=='Lightricks/LTX-Video-0.9.8-13B-distilled'){setStatus('③ 当前模型路由失败，正在自动切换到 LTX-Video 再试一次……');blob=await runVideo(hf,'Lightricks/LTX-Video-0.9.8-13B-distilled',finalPrompt,frames)}else throw firstErr}const url=URL.createObjectURL(blob);video.src=url;video.style.display='block';download.href=url;download.style.display='inline-block';download.style.marginTop='12px';setStatus('🎉 视频生成成功！可以直接播放或保存。','success')}catch(err){console.error(err);let msg=err?.message||String(err),low=msg.toLowerCase();if(low.includes('401')||low.includes('unauthorized')||low.includes('invalid username')||low.includes('invalid token')||low.includes('authentication is required'))msg='Inference Provider 拒绝了本次推理请求。Token 本身已经验证成功，现在需要换可用 Provider/模型或检查账号免费额度。';else if(low.includes('402')||low.includes('credit')||low.includes('payment'))msg='免费额度不足或当前 Provider 要求付费。页面不会自动购买。';setStatus('生成失败：'+msg,'danger')}finally{go.disabled=false;check.disabled=false}};
</script></body></html>
