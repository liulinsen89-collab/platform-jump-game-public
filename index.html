<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>格斗场 · Prototype 0.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);overflow:hidden;background:#090b13;box-shadow:0 0 90px #000}.game:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px 25px #000b}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;left:3.5%;right:3.5%;top:4%;display:flex;align-items:center;gap:20px}.fighter{width:39%}.name{display:flex;justify-content:space-between;align-items:end;margin-bottom:7px;text-shadow:0 2px 10px #000}.name b{font-size:clamp(14px,1.6vw,27px);letter-spacing:2px}.name span{font-size:10px;opacity:.6;letter-spacing:3px}.bar{height:20px;padding:2px;border:1px solid #ffffff55;background:#0d111c;transform:skewX(-14deg);box-shadow:0 4px 18px #000}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ffe27a,#ff5a3d);box-shadow:0 0 18px #ff633f;transition:width .12s linear}.right{text-align:right}.right .bar{transform:skewX(14deg)}.right .fill{margin-left:auto;background:linear-gradient(90deg,#57e9ff,#756bff);box-shadow:0 0 18px #5adfff}.vs{font-weight:1000;font-size:clamp(20px,2.8vw,46px);font-style:italic;text-shadow:0 0 24px #fff8;letter-spacing:-2px}.center{position:absolute;top:15%;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000}.round{font-size:10px;letter-spacing:6px;opacity:.6}.timer{font-size:clamp(22px,2.3vw,38px);font-weight:900;letter-spacing:4px}.status{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:4px;opacity:.48;white-space:nowrap}.announce{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.8);font-size:clamp(28px,6vw,90px);font-weight:1000;font-style:italic;letter-spacing:5px;text-shadow:0 0 30px #fff;opacity:0;transition:.18s;white-space:nowrap}.announce.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="game"><canvas id="c"></canvas><div class="hud">
<div class="top"><div class="fighter"><div class="name"><b>赤 · 烬拳</b><span>BRUISER</span></div><div class="bar"><div id="hp1" class="fill"></div></div></div><div class="vs">VS</div><div class="fighter right"><div class="name"><b>苍 · 霜刃</b><span>DUELIST</span></div><div class="bar"><div id="hp2" class="fill"></div></div></div></div>
<div class="center"><div class="round">THE ARENA · ROUND 01</div><div id="timer" class="timer">90</div></div><div id="announce" class="announce">FIGHT!</div><div id="status" class="status">THE DUEL BEGINS</div>
</div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),hp1=document.getElementById('hp1'),hp2=document.getElementById('hp2'),timerEl=document.getElementById('timer'),announce=document.getElementById('announce'),statusEl=document.getElementById('status');
let W=0,H=0,dpr=1,t=0,last=0,shake=0,ended=false;
function resize(){const r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const sparks=[],rings=[];
function fx(x,y,n,col,pow=1){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=(80+Math.random()*260)*pow;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.45,max:.75,col,size:2+Math.random()*5})}rings.push({x,y,r:8,life:.3,col})}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080b18');g.addColorStop(.48,'#151d35');g.addColorStop(1,'#04050a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
let rg=ctx.createRadialGradient(W*.5,H*.39,10,W*.5,H*.39,H*.65);rg.addColorStop(0,'#536aa655');rg.addColorStop(.55,'#202c4c22');rg.addColorStop(1,'transparent');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
// moon
ctx.fillStyle='#dce9ff18';ctx.beginPath();ctx.arc(W*.5,H*.27,Math.min(W,H)*.095,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff10';ctx.beginPath();ctx.arc(W*.5,H*.27,Math.min(W,H)*.07,0,Math.PI*2);ctx.fill();
// distant mountains
ctx.fillStyle='#0b1020';ctx.beginPath();ctx.moveTo(0,H*.58);for(let x=0;x<=W;x+=W/8){ctx.lineTo(x,H*(.48+((x/W*17)%3)*.025))}ctx.lineTo(W,H*.7);ctx.lineTo(0,H*.7);ctx.fill();
// arena lights
for(let i=0;i<12;i++){let x=(i+.5)*W/12;ctx.fillStyle=i%2?'#7c8fd522':'#ff9c4720';ctx.fillRect(x,H*.43,3,H*.22);ctx.fillRect(x-15,H*.43,33,3)}
// floor perspective
ctx.fillStyle='#070912';ctx.fillRect(0,H*.68,W,H*.32);ctx.fillStyle='#263354';ctx.fillRect(0,H*.68,W,3);ctx.strokeStyle='#8ca4ef1c';ctx.lineWidth=1;for(let i=-9;i<=9;i++){ctx.beginPath();ctx.moveTo(W*.5+i*50,H*.47);ctx.lineTo(W*.5+i*155,H);ctx.stroke()}for(let i=0;i<9;i++){let y=H*.7+i*i*3.7;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
// foreground rails
ctx.strokeStyle='#41547d55';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,H*.62);ctx.lineTo(W,H*.62);ctx.stroke();
}
function drawFighter(f){ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.dir,1);let moving=Math.abs(f.vx)>15;let bob=Math.sin(t*7+f.seed)*2.5+(moving?Math.sin(t*13+f.seed)*2:0);ctx.translate(0,bob);if(f.flash>0){ctx.globalAlpha=.65+Math.sin(t*50)*.35}
// shadow
ctx.save();ctx.scale(1,.22);ctx.fillStyle='#000b';ctx.beginPath();ctx.ellipse(0,10,58,23,0,0,Math.PI*2);ctx.fill();ctx.restore();
// aura
let aura=ctx.createRadialGradient(0,-82,5,0,-82,105);aura.addColorStop(0,f.col+'55');aura.addColorStop(1,'transparent');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(0,-78,105,0,Math.PI*2);ctx.fill();
// legs
ctx.lineCap='round';ctx.lineWidth=18;ctx.strokeStyle=f.dark;ctx.beginPath();ctx.moveTo(-18,-28);ctx.lineTo(-26,12);ctx.lineTo(-44,22);ctx.stroke();ctx.beginPath();ctx.moveTo(18,-28);ctx.lineTo(27,11);ctx.lineTo(44,19);ctx.stroke();
// body
let body=ctx.createLinearGradient(-30,-106,30,-25);body.addColorStop(0,f.col);body.addColorStop(1,f.dark);ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-29,-106,58,78,14);ctx.fill();
ctx.fillStyle=f.accent;ctx.beginPath();ctx.arc(f.dir*32,-92,15,0,Math.PI*2);ctx.fill();
// head
ctx.fillStyle='#d8c4b8';ctx.beginPath();ctx.arc(0,-132,24,0,Math.PI*2);ctx.fill();ctx.fillStyle=f.hair;ctx.beginPath();ctx.arc(0,-141,25,Math.PI,Math.PI*2);ctx.fill();
ctx.fillStyle=f.accent;ctx.shadowBlur=14;ctx.shadowColor=f.accent;ctx.fillRect(f.dir*13,-136,7,3);ctx.shadowBlur=0;
// arms / attack pose
let punch=f.attack>0?Math.sin((1-f.attack)*Math.PI)*32:0;ctx.lineWidth=16;ctx.strokeStyle=f.dark;ctx.beginPath();ctx.moveTo(f.dir*22,-84);ctx.lineTo(f.dir*(54+punch),-58);ctx.stroke();ctx.beginPath();ctx.moveTo(-f.dir*22,-82);ctx.lineTo(-f.dir*48,-53);ctx.stroke();ctx.fillStyle=f.accent;ctx.shadowBlur=15;ctx.shadowColor=f.accent;ctx.beginPath();ctx.arc(f.dir*(57+punch),-57,11,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
// attack arc
if(f.attack>0){ctx.strokeStyle=f.accent+'aa';ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.dir*28,-66,48,-.9,.55);ctx.stroke()}
ctx.restore()}
const A={x:W*.31,y:H*.69,dir:1,vx:0,hp:100,col:'#ef6946',dark:'#702832',accent:'#ffbf70',hair:'#2b1718',seed:0,attack:0,cool:.4,flash:0};
const B={x:W*.69,y:H*.69,dir:-1,vx:0,hp:100,col:'#68dfff',dark:'#2c3d76',accent:'#b8f7ff',hair:'#bcecff',seed:2,attack:0,cool:.8,flash:0};
function reset(){A.x=W*.31;B.x=W*.69;A.hp=B.hp=100;A.cool=.5;B.cool=.9;ended=false;announce.classList.remove('show');statusEl.textContent='THE DUEL BEGINS'}
function hit(att,def,damage){def.hp=Math.max(0,def.hp-damage);def.flash=.16;fx(def.x+def.dir*0,def.y-75,12,att.accent,1);shake=Math.min(10,2+damage*.45);statusEl.textContent=att===A?'烬拳命中':'霜刃命中';if(def.hp<=0)finish(att===A?'赤 · 烬拳':'苍 · 霜刃')}
function finish(winner){if(ended)return;ended=true;announce.textContent=winner+'  ·  胜利';announce.classList.add('show');statusEl.textContent='ROUND OVER · NEW DUEL SOON';fx(winner.includes('烬')?A.x:B.x,(winner.includes('烬')?A.y:B.y)-80,40,'#fff',1.5)}
function update(dt){if(ended)return;let dist=B.x-A.x;let gap=Math.abs(dist);let dir=dist>0?1:-1;A.dir=dir;B.dir=-dir;A.vx=0;B.vx=0;if(gap>170){A.vx=dir*62;B.vx=-dir*48}else if(gap<115){A.vx=-dir*22;B.vx=dir*18}
A.cool-=dt;B.cool-=dt;A.attack=Math.max(0,A.attack-dt);B.attack=Math.max(0,B.attack-dt);
if(gap<180&&A.cool<=0){A.attack=.38;A.cool=1.0;setTimeout(()=>{if(!ended&&Math.abs(B.x-A.x)<205)hit(A,B,7+Math.random()*5)},150)}
if(gap<180&&B.cool<=0){B.attack=.34;B.cool=1.25;setTimeout(()=>{if(!ended&&Math.abs(B.x-A.x)<205)hit(B,A,5+Math.random()*9)},135)}
A.x+=A.vx*dt;B.x+=B.vx*dt;let min=W*.15,max=W*.85;A.x=Math.max(min,Math.min(max,A.x));B.x=Math.max(min,Math.min(max,B.x));A.y=B.y=H*.69;A.flash=Math.max(0,A.flash-dt);B.flash=Math.max(0,B.flash-dt);
for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt;if(p.life<=0)sparks.splice(i,1)}for(let i=rings.length-1;i>=0;i--){let r=rings[i];r.r+=170*dt;r.life-=dt;if(r.life<=0)rings.splice(i,1)}
hp1.style.width=A.hp+'%';hp2.style.width=B.hp+'%';}
function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82;if(shake<.1)shake=0}bg();drawFighter(A);drawFighter(B);for(const r of rings){ctx.globalAlpha=Math.max(0,r.life/.3);ctx.strokeStyle=r.col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;for(const p of sparks){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.shadowBlur=10;ctx.shadowColor=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore()}
function loop(ms){let dt=Math.min(.033,(ms-last)/1000||.016);last=ms;t=ms/1000;update(dt);draw();requestAnimationFrame(loop)}
let started=performance.now();announce.textContent='FIGHT!';announce.classList.add('show');setTimeout(()=>announce.classList.remove('show'),900);setInterval(()=>{if(!ended){let elapsed=Math.floor((performance.now()-started)/1000);let left=Math.max(0,90-elapsed);timerEl.textContent=left;if(left===0)finish(A.hp>=B.hp?'赤 · 烬拳':'苍 · 霜刃')}},250);requestAnimationFrame(loop);
</script>
</body>
</html>
