<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#87ceeb">
<title>Platform Jump Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100vw;height:100vh;max-width:900px;overflow:hidden;background:#87ceeb}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#123;font-weight:800;font-size:18px;text-shadow:0 1px 0 rgba(255,255,255,.7);pointer-events:none}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,420px);padding:22px;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 10px 35px rgba(0,0,0,.22);text-align:center;display:none}
#message h1{margin:0 0 10px;font-size:30px}#message p{margin:6px 0 16px;color:#444}
button{border:0;border-radius:14px;padding:13px 24px;font-size:18px;font-weight:800;background:#1677ff;color:white;box-shadow:0 4px 0 #0753b9}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0753b9}
.controls{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none}
.pad{display:flex;gap:12px;pointer-events:auto}.control{width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(20,30,50,.38);color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);user-select:none}
.jump{width:86px;height:86px;font-size:16px;background:rgba(20,110,255,.65);pointer-events:auto}.control.active{transform:scale(.94);background:rgba(255,255,255,.5)}
@media (min-width:700px){.control{width:62px;height:62px}.jump{width:76px;height:76px}}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div id="hud">← → 移动　·　跳跃　·　到达顶部获胜</div>
<div id="message"><h1 id="title"></h1><p id="sub"></p><button id="restart">重新开始</button></div>
<div class="controls">
  <div class="pad"><div class="control" id="left">◀</div><div class="control" id="right">▶</div></div>
  <div class="control jump" id="jump">跳跃</div>
</div>
</div>
<script>
(() => {
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const message=document.getElementById('message'),title=document.getElementById('title'),sub=document.getElementById('sub'),restart=document.getElementById('restart');
const left=document.getElementById('left'),right=document.getElementById('right'),jumpBtn=document.getElementById('jump');
const W=800,H=600,FPS=60,GRAVITY=.5,JUMP=-12;
let scale=1,gameW=800,gameH=600,state='playing',keys={left:false,right:false};
let player,platforms,enemies,last=0,acc=0;
function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);scale=Math.min(r.width/W,r.height/H);gameW=r.width/scale;gameH=r.height/scale}
window.addEventListener('resize',resize);resize();
function reset(){state='playing';message.style.display='none';player={x:385,y:500,w:30,h:40,vy:0,ground:false,speed:5};platforms=[
{x:0,y:560,w:800,h:40},{x:150,y:500,w:200,h:20},{x:500,y:450,w:200,h:20},{x:150,y:350,w:200,h:20},{x:500,y:300,w:200,h:20},{x:300,y:150,w:200,h:20}];
enemies=[{x:500,y:250,w:30,h:30,s:2,d:1,l:450,r:550},{x:200,y:400,w:30,h:30,s:2,d:1,l:150,r:250}];}
reset();
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function doJump(){if(state==='playing'&&player.ground){player.vy=JUMP;player.ground=false}}
function update(){if(state!=='playing')return;
for(const e of enemies){e.x+=e.s*e.d;if(e.x<=e.l||e.x>=e.r)e.d*=-1}
if(keys.left)player.x-=player.speed;if(keys.right)player.x+=player.speed;
player.x=Math.max(0,Math.min(W-player.w,player.x));player.vy+=GRAVITY;player.y+=player.vy;player.ground=false;
for(const p of platforms){if(rectHit(player,p)&&player.vy>0&&player.y+player.h-player.vy<=p.y){player.y=p.y-player.h;player.vy=0;player.ground=true}}
for(const e of enemies)if(rectHit(player,e)){end(false);return}
if(player.y>H){end(false);return}if(player.y<100)end(true);
}
function end(win){state=win?'win':'over';title.textContent=win?'🎉 YOU WIN!':'💥 GAME OVER';sub.textContent=win?'你到达了顶部！':'碰到敌人或掉出平台了。';message.style.display='block'}
function draw(){const dpr=devicePixelRatio;ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);ctx.clearRect(0,0,W,H);
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#78c9f2');g.addColorStop(1,'#e9f8ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(255,255,255,.55)';for(const c of [[100,100,55],[650,90,70],[400,220,45]]){ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,Math.PI*2);ctx.fill()}
for(const p of platforms){ctx.fillStyle='#19a84b';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#0d7e37';ctx.fillRect(p.x,p.y,p.w,5)}
for(const e of enemies){ctx.fillStyle='#e53935';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#fff';ctx.fillRect(e.x+6,e.y+7,6,6);ctx.fillRect(e.x+18,e.y+7,6,6);ctx.fillStyle='#111';ctx.fillRect(e.x+8,e.y+9,3,3);ctx.fillRect(e.x+20,e.y+9,3,3)}
ctx.fillStyle='#1677ff';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#fff';ctx.fillRect(player.x+7,player.y+9,5,5);ctx.fillRect(player.x+19,player.y+9,5,5);
ctx.fillStyle='#123';ctx.font='bold 16px system-ui';ctx.fillText('顶部',360,135);
}
function loop(t){if(!last)last=t;const dt=Math.min(50,t-last);last=t;acc+=dt;while(acc>=1000/FPS){update();acc-=1000/FPS}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function bindHold(el,name){const on=e=>{e.preventDefault();keys[name]=true;el.classList.add('active')};const off=e=>{e.preventDefault();keys[name]=false;el.classList.remove('active')};['pointerdown'].forEach(x=>el.addEventListener(x,on));['pointerup','pointercancel','pointerleave'].forEach(x=>el.addEventListener(x,off))}
bindHold(left,'left');bindHold(right,'right');jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();jumpBtn.classList.add('active');doJump()});['pointerup','pointercancel','pointerleave'].forEach(x=>jumpBtn.addEventListener(x,e=>{e.preventDefault();jumpBtn.classList.remove('active')}));
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.code==='Space'){e.preventDefault();doJump()}if(e.key.toLowerCase()==='r'&&state!=='playing')reset()});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});
restart.addEventListener('click',reset);
})();
</script>
</body>
</html>
