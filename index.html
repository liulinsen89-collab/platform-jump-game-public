<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>AI 格斗场 · Prototype 0.1</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070911;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{display:grid;place-items:center}.game{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);overflow:hidden;background:#0a0d18;box-shadow:0 0 70px #000}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;left:4%;right:4%;top:4%;display:flex;align-items:center;gap:22px}.fighter{width:38%;}.name{display:flex;justify-content:space-between;align-items:end;margin-bottom:7px;text-shadow:0 2px 8px #000}.name b{font-size:clamp(14px,1.55vw,27px);letter-spacing:2px}.name span{font-size:11px;opacity:.65;letter-spacing:2px}.bar{height:18px;padding:2px;border:1px solid rgba(255,255,255,.35);background:#111624;transform:skewX(-16deg);box-shadow:0 4px 15px #0008}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ffe16a,#ff6a45);box-shadow:0 0 14px #ff7040}.right{text-align:right}.right .bar{transform:skewX(16deg)}.right .fill{margin-left:auto;background:linear-gradient(90deg,#5be7ff,#7b6cff)}.vs{font-weight:900;font-size:clamp(18px,2.5vw,44px);font-style:italic;opacity:.8;text-shadow:0 0 20px #fff6}.sub{position:absolute;top:16%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:5px;opacity:.45}.hint{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;opacity:.45;white-space:nowrap}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 100px 25px #0009}
</style>
</head>
<body>
<div class="game">
<canvas id="c"></canvas>
<div class="hud">
  <div class="top">
    <div class="fighter"><div class="name"><b>赤 · 烬拳</b><span>BRUISER</span></div><div class="bar"><div class="fill"></div></div></div>
    <div class="vs">VS</div>
    <div class="fighter right"><div class="name"><b>苍 · 霜刃</b><span>DUELIST</span></div><div class="bar"><div class="fill"></div></div></div>
  </div>
  <div class="sub">THE ARENA · ROUND 01</div><div class="hint">CHARACTER SHOWCASE · AUTO BATTLE PROTOTYPE</div><div class="vignette"></div>
</div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr=1,t=0,shake=0;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=Math.round(r.width*dpr);H=Math.round(r.height*dpr);canvas.width=W;canvas.height=H;ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height}addEventListener('resize',resize);resize();
const P=[];function burst(x,y,n,color,power=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*7)*power;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:.45+Math.random()*.5,color,size:2+Math.random()*5})}}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080b18');g.addColorStop(.55,'#111a32');g.addColorStop(1,'#05060b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H*.39;let rg=ctx.createRadialGradient(cx,cy,10,cx,cy,H*.55);rg.addColorStop(0,'#43578c55');rg.addColorStop(1,'#0b0d16');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#91a8ff12';ctx.lineWidth=1;for(let i=0;i<14;i++){let y=H*.45+i*i*2.4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(W/2+i*70,H*.48);ctx.lineTo(W/2+i*150,H);ctx.stroke()}
  ctx.fillStyle='#020308';ctx.fillRect(0,H*.69,W,H*.31);ctx.fillStyle='#182039';ctx.fillRect(0,H*.69,W,3);
  for(let i=0;i<9;i++){let x=(i+1)*W/10;ctx.fillStyle=i%2?'#27365b':'#1d2948';ctx.fillRect(x,H*.58-(i%3)*8,3,H*.11);ctx.fillRect(x-18,H*.58-(i%3)*8,39,3)}
}
function fighter(x,base,side,energy,phase){ctx.save();ctx.translate(x,base);ctx.scale(side,1);let bob=Math.sin(t*4+phase)*3;ctx.translate(0,bob);
  // shadow
  ctx.save();ctx.scale(1,.2);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,10,58,22,0,0,Math.PI*2);ctx.fill();ctx.restore();
  // aura
  let aura=ctx.createRadialGradient(0,-80,5,0,-80,105);aura.addColorStop(0,energy?'#ff795555':'#62d9ff44');aura.addColorStop(1,'transparent');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(0,-75,105,0,Math.PI*2);ctx.fill();
  // legs
  ctx.lineCap='round';ctx.lineWidth=18;ctx.strokeStyle=side>0?'#7f3028':'#273c68';ctx.beginPath();ctx.moveTo(-18,-28);ctx.lineTo(-25,15);ctx.lineTo(-43,24);ctx.stroke();ctx.beginPath();ctx.moveTo(18,-28);ctx.lineTo(27,12);ctx.lineTo(45,20);ctx.stroke();
  // torso
  let body=ctx.createLinearGradient(-30,-105,30,-25);body.addColorStop(0,side>0?'#ef6b45':'#75dfff');body.addColorStop(1,side>0?'#641e28':'#29366f');ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-29,-106,58,78,15);ctx.fill();
  // shoulder guard
  ctx.fillStyle=side>0?'#ffbd69':'#a9f6ff';ctx.beginPath();ctx.arc(side*32,-92,15,0,Math.PI*2);ctx.fill();
  // head
  ctx.fillStyle='#d9c5b7';ctx.beginPath();ctx.arc(0,-132,24,0,Math.PI*2);ctx.fill();ctx.fillStyle=side>0?'#2b1718':'#bfe9ff';ctx.beginPath();ctx.arc(0,-141,25,Math.PI,Math.PI*2);ctx.fill();
  // eye glow
  ctx.fillStyle=side>0?'#ffb06a':'#7eeeff';ctx.shadowBlur=12;ctx.shadowColor=ctx.fillStyle;ctx.fillRect(side*13,-136,7,3);ctx.shadowBlur=0;
  // arms
  ctx.lineWidth=16;ctx.strokeStyle=side>0?'#a63e31':'#35508a';ctx.beginPath();ctx.moveTo(side*22,-84);ctx.lineTo(side*54,-57);ctx.stroke();ctx.beginPath();ctx.moveTo(-side*22,-82);ctx.lineTo(-side*48,-53);ctx.stroke();
  // fists
  ctx.fillStyle=side>0?'#ff8b54':'#70dfff';ctx.shadowBlur=15;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(side*57,-55,11,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.restore()}
function loop(ms){t=ms/1000;ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}bg();let ground=H*.72;fighter(W*.32,ground,1,true,0);fighter(W*.68,ground,-1,false,1.6);
  // floating motes
  for(let i=0;i<35;i++){let x=(i*97+t*8)%W,y=(i*53+Math.sin(t+i)*18)% (H*.7);ctx.fillStyle='#b7c7ff33';ctx.fillRect(x,y,2,2)}
  for(let i=P.length-1;i>=0;i--){let p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.016;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();if(p.life<=0)P.splice(i,1)}ctx.globalAlpha=1;
  // center sparks
  if(Math.floor(t*2)!==Math.floor((t-.016)*2)){burst(W*.5,H*.48,5,'#d8e8ff',.5);shake=1.8}
  ctx.restore();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body></html>
