<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>格斗场 · Prototype 0.5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);overflow:hidden;background:#070914;box-shadow:0 0 100px #000}.game:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 110px 24px #000b}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;left:3.5%;right:3.5%;top:3.5%;display:flex;align-items:center;gap:20px}.fighter{width:39%}.name{display:flex;justify-content:space-between;align-items:end;margin-bottom:7px;text-shadow:0 2px 10px #000}.name b{font-size:clamp(14px,1.6vw,27px);letter-spacing:2px}.name span{font-size:10px;opacity:.6;letter-spacing:3px}.bar{height:20px;padding:2px;border:1px solid #ffffff55;background:#0b0f1a;transform:skewX(-14deg);box-shadow:0 4px 18px #000}.fill{height:100%;width:100%;transition:width .12s linear}.leftfill{background:linear-gradient(90deg,#ffe27a,#ff553b);box-shadow:0 0 18px #ff633f}.rightfill{margin-left:auto;background:linear-gradient(90deg,#55e8ff,#716cff);box-shadow:0 0 18px #5adfff}.right{text-align:right}.right .bar{transform:skewX(14deg)}.vs{font-weight:1000;font-size:clamp(20px,2.8vw,46px);font-style:italic;text-shadow:0 0 24px #fff8;letter-spacing:-2px}.center{position:absolute;top:14%;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000}.round{font-size:10px;letter-spacing:6px;opacity:.65}.timer{font-size:clamp(22px,2.3vw,38px);font-weight:900;letter-spacing:4px}.status{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:4px;opacity:.65;white-space:nowrap}.announce{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.7);font-size:clamp(28px,6vw,90px);font-weight:1000;font-style:italic;letter-spacing:5px;text-shadow:0 0 30px #fff;opacity:0;transition:.16s;white-space:nowrap}.announce.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.combo{position:absolute;top:29%;font-size:clamp(18px,2.3vw,34px);font-weight:900;font-style:italic;opacity:0;transition:.12s;text-shadow:0 0 16px currentColor}.combo.show{opacity:1}.combo.a{left:8%;color:#ffb35d}.combo.b{right:8%;color:#8ff3ff;text-align:right}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .16s ease-out}@keyframes flash{0%{opacity:.16}100%{opacity:0}}
</style>
</head>
<body><div class="game"><canvas id="c"></canvas><div class="hud">
<div class="top"><div class="fighter"><div class="name"><b>赤 · 烬拳</b><span>BRUISER</span></div><div class="bar"><div id="hp1" class="fill leftfill"></div></div></div><div class="vs">VS</div><div class="fighter right"><div class="name"><b>苍 · 霜刃</b><span>DUELIST</span></div><div class="bar"><div id="hp2" class="fill rightfill"></div></div></div></div>
<div class="center"><div class="round">THE ARENA · ROUND 01</div><div id="timer" class="timer">90</div></div><div id="announce" class="announce">FIGHT!</div><div id="comboA" class="combo a">2 HIT</div><div id="comboB" class="combo b">2 HIT</div><div id="status" class="status">THE DUEL BEGINS</div><div id="flash" class="flash"></div>
</div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),hp1=document.getElementById('hp1'),hp2=document.getElementById('hp2'),timerEl=document.getElementById('timer'),announce=document.getElementById('announce'),statusEl=document.getElementById('status'),flash=document.getElementById('flash'),comboA=document.getElementById('comboA'),comboB=document.getElementById('comboB');
let W=0,H=0,dpr=1,t=0,last=performance.now(),shake=0,ended=false,started=performance.now();
const arenaBg=new Image();arenaBg.src='arena-background.jpg';
function resize(){const r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const sparks=[],rings=[],slashes=[],trails=[],mist=[];
for(let i=0;i<8;i++)mist.push({x:Math.random(),y:.48+Math.random()*.22,w:.12+Math.random()*.25,v:.006+Math.random()*.012,a:.035+Math.random()*.06});
function fx(x,y,n,col,pow=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(70+Math.random()*300)*pow;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.5,max:.75,col,size:1.5+Math.random()*5})}rings.push({x,y,r:10,life:.32,col})}
function slash(x,y,dir,col){slashes.push({x,y,dir,col,life:.2,max:.2})}
function bg(){ctx.save();if(arenaBg.complete&&arenaBg.naturalWidth){const iw=arenaBg.naturalWidth,ih=arenaBg.naturalHeight,sc=Math.max(W/iw,H/ih)*1.035,sw=iw*sc,sh=ih*sc;const px=(W-sw)*.5+Math.sin(t*.08)*3,py=(H-sh)*.5+Math.sin(t*.05)*2;ctx.drawImage(arenaBg,px,py,sw,sh)}else{let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071022');g.addColorStop(1,'#08040b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
let glow=ctx.createRadialGradient(W*.5,H*.23,10,W*.5,H*.3,H*.7);glow.addColorStop(0,'#d7e7ff16');glow.addColorStop(.5,'#8bb8ff08');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
ctx.globalCompositeOperation='screen';for(const m of mist){m.x+=m.v*0.016;if(m.x>1.15)m.x=-.15;ctx.fillStyle='rgba(180,205,255,'+m.a+')';ctx.beginPath();ctx.ellipse(m.x*W,m.y*H,m.w*W,.025*H,0,0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation='source-over';ctx.restore()}
function drawFighter(f){ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.dir,1);ctx.scale(.72,.72);let moving=Math.abs(f.vx)>18;let bob=Math.sin(t*7+f.seed)*2.5+(moving?Math.sin(t*15+f.seed)*2:0);ctx.translate(0,bob);if(f.flash>0)ctx.globalAlpha=.65+Math.sin(t*60)*.35;ctx.save();ctx.scale(1,.2);ctx.fillStyle='#000c';ctx.beginPath();ctx.ellipse(0,10,62,24,0,0,Math.PI*2);ctx.fill();ctx.restore();let aura=ctx.createRadialGradient(0,-84,4,0,-84,115);aura.addColorStop(0,f.col+'66');aura.addColorStop(1,'transparent');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(0,-80,112,0,Math.PI*2);ctx.fill();ctx.lineCap='round';ctx.lineWidth=18;ctx.strokeStyle=f.dark;ctx.beginPath();ctx.moveTo(-18,-28);ctx.lineTo(-27,12);ctx.lineTo(-45,22);ctx.stroke();ctx.beginPath();ctx.moveTo(18,-28);ctx.lineTo(28,11);ctx.lineTo(45,19);ctx.stroke();let body=ctx.createLinearGradient(-30,-106,30,-25);body.addColorStop(0,f.col);body.addColorStop(1,f.dark);ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-30,-107,60,80,15);ctx.fill();ctx.strokeStyle='#ffffff20';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=f.accent;ctx.beginPath();ctx.arc(f.dir*33,-93,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8c4b8';ctx.beginPath();ctx.arc(0,-133,24,0,Math.PI*2);ctx.fill();ctx.fillStyle=f.hair;ctx.beginPath();ctx.arc(0,-142,25,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle=f.accent;ctx.shadowBlur=16;ctx.shadowColor=f.accent;ctx.fillRect(f.dir*13,-137,7,3);ctx.shadowBlur=0;let punch=f.attack>0?Math.sin((1-f.attack)/f.attackMax*Math.PI)*42:0;ctx.lineWidth=16;ctx.strokeStyle=f.dark;ctx.beginPath();ctx.moveTo(f.dir*22,-84);ctx.lineTo(f.dir*(55+punch),-58);ctx.stroke();ctx.beginPath();ctx.moveTo(-f.dir*22,-82);ctx.lineTo(-f.dir*48,-53);ctx.stroke();ctx.fillStyle=f.accent;ctx.shadowBlur=18;ctx.shadowColor=f.accent;ctx.beginPath();ctx.arc(f.dir*(58+punch),-57,11,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(f.attack>0){ctx.strokeStyle=f.accent+'cc';ctx.lineWidth=6;ctx.beginPath();ctx.arc(f.dir*28,-67,52,-.95,.58);ctx.stroke()}if(f.dodge>0){ctx.strokeStyle=f.accent+'66';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-78,82,-2.4,.3);ctx.stroke()}ctx.restore()}
const A={x:0,y:0,dir:1,vx:0,hp:100,col:'#ef6946',dark:'#702832',accent:'#ffbf70',hair:'#2b1718',seed:0,attack:0,attackMax:.42,cool:.7,flash:0,combo:0,lastHit:0,moveTime:0,moveDir:0,moveSpeed:105,dodge:0};
const B={x:0,y:0,dir:-1,vx:0,hp:100,col:'#68dfff',dark:'#2c3d76',accent:'#b8f7ff',hair:'#bcecff',seed:2,attack:0,attackMax:.36,cool:1,flash:0,combo:0,lastHit:0,moveTime:0,moveDir:0,moveSpeed:125,dodge:0};
function init(){A.x=W*.31;B.x=W*.69;A.y=B.y=H*.69;A.hp=B.hp=100;A.cool=.7;B.cool=1;A.combo=B.combo=0;A.moveTime=0;B.moveTime=0;A.dodge=B.dodge=0;ended=false;started=performance.now();hp1.style.width='100%';hp2.style.width='100%';announce.textContent='FIGHT!';announce.classList.add('show');setTimeout(()=>announce.classList.remove('show'),850)}
function hit(att,def,damage){if(ended)return;def.hp=Math.max(0,def.hp-damage);def.flash=.2;att.combo++;att.lastHit=t;fx(def.x,def.y-72,15,att.accent,1);slash(def.x,def.y-70,att.dir,att.accent);shake=Math.min(12,3+damage*.5);flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');statusEl.textContent=att===A?'烬拳 · 命中！':'霜刃 · 命中！';let el=att===A?comboA:comboB;el.textContent=att.combo+' HIT';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),500);if(def.hp<=0)finish(att===A?'赤 · 烬拳':'苍 · 霜刃')}
function finish(winner){if(ended)return;ended=true;announce.textContent=winner+'  ·  胜利';announce.classList.add('show');statusEl.textContent='ROUND OVER · NEW DUEL';fx(winner.includes('烬')?A.x:B.x,(winner.includes('烬')?A.y:B.y)-80,50,'#fff',1.5)}
function chooseMovement(f,other,gap,dir){f.moveTime-=1/60;if(f.moveTime<=0){f.moveTime=.45+Math.random()*1.05;let r=Math.random();if(r<.28)f.moveDir=0;else f.moveDir=Math.random()<.5?-1:1;if(Math.random()<.16&&gap<250&&other.attack>0){f.dodge=f.moveTime*.55;f.moveDir=-dir}}let targetGap=f===A?145:185;let approach=0;if(gap>targetGap+35)approach=dir;else if(gap<targetGap-30)approach=-dir;f.vx=approach*f.moveSpeed+f.moveDir*(f.moveDir?55:0);if(f.dodge>0){f.dodge-=1/60;f.vx+=(-dir)*145}if(Math.abs(f.vx)>1)trails.push({x:f.x,y:f.y-35,col:f.accent,life:.16,max:.16})}
function update(dt){if(ended)return;let dist=B.x-A.x,gap=Math.abs(dist),dir=dist>0?1:-1;A.dir=dir;B.dir=-dir;A.cool-=dt;B.cool-=dt;A.attack=Math.max(0,A.attack-dt);B.attack=Math.max(0,B.attack-dt);A.flash=Math.max(0,A.flash-dt);B.flash=Math.max(0,B.flash-dt);if(t-A.lastHit>1.4)A.combo=0;if(t-B.lastHit>1.4)B.combo=0;chooseMovement(A,B,gap,dir);chooseMovement(B,A,gap,-dir);if(gap<205&&A.cool<=0){A.attack=A.attackMax;A.cool=.75+Math.random()*.35;setTimeout(()=>{if(!ended&&Math.abs(B.x-A.x)<225&&B.dodge<=0)hit(A,B,6+Math.random()*6)},155)}if(gap<210&&B.cool<=0){B.attack=B.attackMax;B.cool=.85+Math.random()*.5;setTimeout(()=>{if(!ended&&Math.abs(B.x-A.x)<225&&A.dodge<=0)hit(B,A,5+Math.random()*8)},135)}A.x+=A.vx*dt;B.x+=B.vx*dt;let min=W*.10,max=W*.90;A.x=Math.max(min,Math.min(max,A.x));B.x=Math.max(min,Math.min(max,B.x));if(B.x-A.x<70){let push=(70-(B.x-A.x))/2;A.x-=push;B.x+=push}A.y=B.y=H*.69;for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.965;p.vy*=.965;p.life-=dt;if(p.life<=0)sparks.splice(i,1)}for(let i=rings.length-1;i>=0;i--){let r=rings[i];r.r+=180*dt;r.life-=dt;if(r.life<=0)rings.splice(i,1)}for(let i=slashes.length-1;i>=0;i--){slashes[i].life-=dt;if(slashes[i].life<=0)slashes.splice(i,1)}for(let i=trails.length-1;i>=0;i--){trails[i].life-=dt;if(trails[i].life<=0)trails.splice(i,1)}hp1.style.width=A.hp+'%';hp2.style.width=B.hp+'%';let left=Math.max(0,90-Math.floor((performance.now()-started)/1000));timerEl.textContent=left;if(left===0)finish(A.hp>=B.hp?'赤 · 烬拳':'苍 · 霜刃')}
function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.8;if(shake<.1)shake=0}bg();for(const tr of trails){ctx.globalAlpha=Math.max(0,tr.life/tr.max)*.25;ctx.fillStyle=tr.col;ctx.beginPath();ctx.arc(tr.x,tr.y,25,0,Math.PI*2);ctx.fill()}drawFighter(A);drawFighter(B);for(const s of slashes){ctx.globalAlpha=s.life/s.max;ctx.strokeStyle=s.col;ctx.lineWidth=7;ctx.beginPath();ctx.arc(s.x+s.dir*15,s.y,60,-1.1,.45);ctx.stroke()}for(const r of rings){ctx.globalAlpha=Math.max(0,r.life/.32);ctx.strokeStyle=r.col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()}for(const p of sparks){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.shadowBlur=10;ctx.shadowColor=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.restore()}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;t+=dt;update(dt);draw();requestAnimationFrame(loop)}init();requestAnimationFrame(loop);
</script>
</body>
</html>
